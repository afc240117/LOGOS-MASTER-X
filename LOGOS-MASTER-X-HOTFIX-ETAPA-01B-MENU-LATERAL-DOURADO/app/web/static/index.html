<script>
(function(){
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
    if ('caches' in window) caches.keys().then(function(keys){keys.filter(function(k){return k.indexOf('logos-master-x')===0;}).forEach(function(k){caches.delete(k);});});
  } catch(e) {}
})();
</script>

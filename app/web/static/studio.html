<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>LOGOS STUDIO — MASTER X</title><link rel="stylesheet" href="./studio.css"></head><body><header class="top"><div class="brand">LOGOS STUDIO</div><a href="./index.html">← LOGOS MASTER X</a></header><main class="shell"><section class="hero"><span class="badge">THINK ENGINE ATIVO</span><h1>Central de Produção</h1><p>Estudo → contexto → exegese → grande ideia → estrutura → aplicação → K7 → clímax → revisão.</p><div id="status" class="status">Modo local/offline.</div></section><section class="panel"><div id="commands" class="commands"></div></section><div class="grid2"><section class="panel"><h2 id="commandTitle">LOGOS SERMÃO</h2><label>Texto bíblico / passagem</label><input id="text" placeholder="Ex.: Lamentações 5:21-22"><label>Tema</label><input id="theme" placeholder="Ex.: Restauração espiritual"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><div><label>Tempo</label><select id="duration"><option>20</option><option>30</option><option>35</option><option selected>40</option><option>50</option><option>60</option><option>70</option></select></div><div><label>Intensidade K7</label><select id="intensity"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><label>Culto</label><select id="cult"><option>Avivamento</option><option>Doutrina</option><option>Santa Ceia</option><option>Missões</option><option>Jovens</option><option>Família</option><option>Evangelístico</option><option>Círculo de Oração</option></select></div><div><label>Público</label><input id="audience" value="Igreja local"></div></div><label>Objetivo</label><input id="objective" placeholder="O que a mensagem deve produzir?"><label>Observações</label><textarea id="notes" placeholder="Detalhes adicionais..."></textarea><div class="row"><button class="btn primary" id="run">Executar localmente</button><button class="btn green" id="chat">Abrir no ChatGPT</button><button class="btn" id="copy">Copiar</button><button class="btn" id="save">Salvar projeto</button></div><h3>Resultado do pipeline</h3><div id="out" class="out">Pronto.</div></section><aside class="panel history"><h2>Projetos recentes</h2><div id="history"></div></aside></div></main><script src="./prompt-library.js"></script><script src="./studio-runtime.js"></script><script src="./studio-app.js"></script></body></html>

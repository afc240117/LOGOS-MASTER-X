<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áudio X · Histórico</title><link rel="stylesheet" href="./audio-x-cloud-etapa-10.css"></head><body>
<main class="shell">
<header><div><h1>🎧 Áudio X</h1><p>Etapa 10 · Central de Histórico e Resultados</p></div><button id="refresh">↻ Atualizar</button></header>

<section class="toolbar card">
<input id="search" placeholder="Buscar por título, arquivo, provedor ou perfil...">
<select id="filter"><option value="">Todos</option><option value="completed">Concluídos</option><option value="running">Em andamento</option><option value="failed">Falharam</option></select>
</section>

<section class="layout">
<article class="card">
<div class="head"><div><h2>Análises anteriores</h2><p id="count">0 resultados</p></div></div>
<div id="list" class="list empty">Nenhum histórico encontrado.</div>
</article>

<aside class="card">
<h2>Detalhes</h2>
<div id="detail" class="empty">Selecione uma análise.</div>
<div class="actions">
<button id="resume" disabled>▶ Retomar</button>
<button id="studio" disabled>🧬 Studio X</button>
<button id="delete" class="danger" disabled>🗑 Excluir</button>
</div>
</aside>
</section>
</main>
<script src="./audio-x-history-client.js"></script>
<script src="./audio-x-cloud-etapa-10.js"></script>
</body></html>

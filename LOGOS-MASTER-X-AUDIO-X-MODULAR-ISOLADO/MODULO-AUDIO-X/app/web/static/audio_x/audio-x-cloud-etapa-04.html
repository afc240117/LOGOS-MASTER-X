<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áudio X Etapa 4</title><style>
body{margin:0;background:#05080c;color:#eef2f5;font-family:Segoe UI,Arial}.x{max-width:1100px;margin:auto;padding:24px}.card{background:#0a1016;border:1px solid #1c2933;border-radius:12px;padding:18px}.flow{color:#d9a72f;margin:14px 0}.bar{height:10px;background:#17232c;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#d9a72f;transition:.35s}.row{display:flex;justify-content:space-between;gap:10px;margin:12px 0}.muted{color:#8d99a3}button{background:#d9a72f;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.attempt{padding:8px;border-bottom:1px solid #17232c}
</style></head><body><main class="x"><h1>🎧 Áudio X</h1><p class="muted">Etapa 4 · Jobs assíncronos + progresso</p><section class="card"><div class="flow">MP3 → Job → Worker Cloud → Groq → Deepgram → OpenAI → Resultado</div><div class="row"><span id="name">Nenhum Job da Etapa 2 encontrado</span><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div><div class="row"><span id="state" class="muted">Aguardando</span><button id="start" disabled>▶ Processar em segundo plano</button></div><div id="attempts"></div></section></main><script src="./audio-x-cloud-async-client.js"></script><script>
const q=id=>document.getElementById(id);let job=null;try{job=JSON.parse(sessionStorage.getItem("logosMasterX.audioXCloud.job")||"null")}catch{}
if(job){q("name").textContent=(job.title||job.filename)+" · "+job.id;q("start").disabled=false}
function render(d){if(d.error){q("state").textContent=d.error;return}const j=d.job||{};q("pct").textContent=(j.progress||0)+"%";q("bar").style.width=(j.progress||0)+"%";q("state").textContent=(j.status||"—")+" · "+(j.selected_provider||"aguardando provedor");q("attempts").innerHTML=(j.provider_attempts||[]).map(a=>`<div class="attempt">${a.provider}: ${a.status}${a.error?" — "+a.error:""}</div>`).join("");if(j.transcription_status==="completed"){q("state").textContent="✓ Transcrição concluída sem bloquear a tela";q("start").disabled=true;if(d.result)sessionStorage.setItem("logosMasterX.audioXCloud.transcription",JSON.stringify(d.result))}if(j.transcription_status==="failed"){q("start").disabled=false}}
q("start").onclick=async()=>{q("start").disabled=true;await AudioXAsync.start(job.id);AudioXAsync.watch(job.id,render)};
</script></body></html>

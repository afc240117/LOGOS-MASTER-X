<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áudio X · Editor</title><link rel="stylesheet" href="./audio-x-etapa-18.css"></head><body>
<main><header><div><span>ÁUDIO X · ETAPA 18</span><h1>✎ Editor da Transcrição</h1><p>Revise o texto antes da extração definitiva do DNA K7.</p></div><div><button id="load">Abrir JSON</button><button id="session">Usar transcrição atual</button><button id="save" class="gold">Salvar revisão</button></div></header>
<input id="file" type="file" accept=".json" hidden>
<section class="toolbar card"><input id="search" placeholder="Buscar palavra, nome ou referência..."><button id="replace">Buscar/Substituir</button><button id="undo">↶ Desfazer</button><button id="redo">↷ Refazer</button><span id="status">Nenhuma transcrição</span></section>
<section class="layout"><article class="card"><div class="head"><h2>Segmentos</h2><b id="count">0</b></div><div id="segments" class="segments empty">Carregue uma transcrição.</div></article>
<aside class="card side"><h2>Ferramentas</h2><button id="split">✂ Dividir no cursor</button><button id="mergePrev">⇡ Unir ao anterior</button><button id="mergeNext">⇣ Unir ao próximo</button><button id="delete">🗑 Excluir trecho</button><hr><label>Início (s)<input id="start" type="number" step=".01"></label><label>Fim (s)<input id="end" type="number" step=".01"></label><hr><button id="normalize">Aa Normalizar espaços</button><button id="bible">📖 Corrigir referências comuns</button><div class="note">As alterações ficam em uma cópia revisada. O original da transcrição não é apagado.</div></aside></section>
<div id="replaceBox" class="modal"><div><h2>Buscar e substituir</h2><input id="findText" placeholder="Buscar"><input id="replaceText" placeholder="Substituir por"><p><button id="cancelReplace">Cancelar</button><button id="doReplace" class="gold">Substituir tudo</button></p></div></div>
<script src="./audio-x-etapa-18.js"></script></body></html>
